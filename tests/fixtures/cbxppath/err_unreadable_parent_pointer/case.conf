# CBXPPATH fixture. Values are shell-quoted; @CASE@ is the absolute fixture directory.
# mycb has no parent, so its root is address 0 (the PSA) and its pointer to
# mychild sits at offset 2048, in the fetch-protected half of the PSA.
# Finding the root of mychild reads that pointer. The fault must be trapped
# and reported as unreachable instead of abending.
EXPECT=err
CODE=9
MESSAGE='Cannot reach control block'
COMMAND=extract
CBXPPATH='@CASE@/mappings'
BLOCK=mychild
