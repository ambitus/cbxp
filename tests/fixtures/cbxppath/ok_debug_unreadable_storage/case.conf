# CBXPPATH fixture. Values are shell-quoted; @CASE@ is the absolute fixture directory.
# This psa mapping overrides the built-in one and is large enough that the
# debug hex dump (2060 bytes) reaches the fetch-protected half of the PSA at
# offset 2048. The dump must report unreadable storage instead of abending.
# The extract still succeeds because fields past the readable length are
# never read.
EXPECT=ok
COMMAND=extract
DEBUG=1
CBXPPATH='@CASE@/mappings'
BLOCK=psa
CONTAINS='"psafld":'
LOG_CONTAINS='<unreadable storage>'
