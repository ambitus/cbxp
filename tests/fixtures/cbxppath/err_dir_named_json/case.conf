# CBXPPATH fixture. Values are shell-quoted; @CASE@ is the absolute fixture directory.
# mappings/looks_like_a_file.json is a directory, not a file. It is not skipped by
# the loader, but reading it yields no data, so it must be reported as bad JSON.
EXPECT=err
CODE=8
MESSAGE='Could not parse a JSON file'
COMMAND=format
CBXPPATH='@CASE@/mappings'
BLOCK=cvt
SAMPLE=cvt.bin
